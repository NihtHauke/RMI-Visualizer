# electron-builder config — `npm run dist` builds the Windows installer into dist/.
# The web build is the same index.html; nothing here forks it.
appId: com.rmi.roofvisualizer
productName: RMI Roof Visualizer
copyright: RMI
directories:
  output: dist
  buildResources: build
files:
  - index.html
  - electron/**
  - vendor/**
  - models/*.glb
  - build/icon.png
  - "!**/*.blend"
  - "!**/*.blend1"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: "${productName} Setup ${version}.${ext}"
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RMI Roof Visualizer
  deleteAppDataOnUninstall: false
